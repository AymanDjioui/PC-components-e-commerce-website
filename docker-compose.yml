version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: pc-components-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=pc-components-ecommerce

volumes:
  mongodb_data:
    driver: local
